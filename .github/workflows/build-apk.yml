name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential \
            libsqlite3-dev python3-virtualenv automake autopoint gettext ffmpeg

      - name: Enforce pip constraints for all environments
        run: |
          echo "PIP_CONSTRAINT=$GITHUB_WORKSPACE/ci-constraints.txt" >> $GITHUB_ENV

      - name: Install Buildozer, Cython, and pinned build dependencies
        run: |
          python -m pip install --upgrade "pip<25.0" "setuptools<70.0.0" wheel
          python -m pip install cython==0.29.36
          python -m pip install --upgrade buildozer

      - name: Build Android APK with Buildozer
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MSK-YTDL-Android-APK
          path: bin/*.apk
          retention-days: 30

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-full-log
          path: buildozer.log
          if-no-files-found: ignore
          retention-days: 7
